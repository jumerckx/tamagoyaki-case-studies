[project]
name = "tamagoyaki-case-studies"
version = "0.1.0"
requires-python = ">=3.13"
# The two evaluation pipelines and the tools they call. Nothing here is needed
# to build or use Tamagoyaki itself -- that repository keeps its own, much
# smaller, Python surface (lit, cmake-format, pre-commit and the docs stack).
dependencies = [
    "cmake-format>=0.6.13",
    "lit>=18.1.8",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pre-commit>=4.5.1",
    "snakemake>=9",
    "snakemake-executor-plugin-cluster-generic>=1",
    "xdsl>=0.56.2",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
tamagoyaki-case-studies = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["herbie_mlir", "tamagoyaki_eval"]

[project.scripts]
fpcore-mlir = "herbie_mlir.tools.fpcore_mlir:entry"
herbie-pdl = "herbie_mlir.tools.herbie_pdl:entry"
mlir-fpcore = "herbie_mlir.tools.mlir_fpcore:entry"
insert-fpcore-alternative = "herbie_mlir.tools.insert_fpcore_alternative:entry"
extract-accuracies = "herbie_mlir.tools.extract_accuracies:entry"
plot-accuracies = "herbie_mlir.tools.plot_accuracies:entry"
plot-timing = "herbie_mlir.tools.plot_timing:entry"
plot-matcher-speedup = "herbie_mlir.tools.plot_matcher_speedup:entry"
rover-abc-stats = "tamagoyaki_eval.rover.abc_stats:entry"
rover-results-csv = "tamagoyaki_eval.rover.results_csv:entry"
rover-latex-table = "tamagoyaki_eval.rover.latex_table:entry"
rover-egraph-csv = "tamagoyaki_eval.rover.egraph_csv:entry"
rover-egraph-table = "tamagoyaki_eval.rover.egraph_table:entry"


[dependency-groups]
dev = [
    "tamagoyaki-case-studies",
]

[project.entry-points.'xdsl.universe']
tools = 'herbie_mlir.tools:EQSAT_UNIVERSE'
